# Local self-dogfood control plane for the kind-dib cluster.
#
# The hosted application is reached through Ingress at
# /<context>/api/* -> Service dib-control-plane. Do not replace this with a
# host IP or host port: hosted containers must remain independent of the host.
#
# Before applying, load the locally built image into kind:
#   kind load docker-image dibs/build-server:dev --name dib

apiVersion: v1
kind: Namespace
metadata:
  name: dib-hosted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dib-control-plane
  namespace: dib-hosted
  labels:
    app.kubernetes.io/name: dib-control-plane
    app.kubernetes.io/part-of: docker-image-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dib-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dib-control-plane
        app.kubernetes.io/part-of: docker-image-builder
    spec:
      containers:
        - name: build-server
          image: dibs/build-server:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: BUILD_REPOSITORY_BACKEND
              value: memory
            - name: ADMIN_IDS
              value: admin
            # Internal deployment mode: callers provide the registration ID
            # in X-User-Id, which becomes the build/service owner scope.
            # This is not authentication; keep the control plane on a trusted
            # network. Use AUTH_MODE=required/oidc for externally exposed runs.
            - name: AUTH_MODE
              value: disabled
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: BUILD_MONITOR_DIST_PATH
              value: /app/apps/build-monitor/dist
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dib-control-plane
  namespace: dib-hosted
  labels:
    app.kubernetes.io/name: dib-control-plane
    app.kubernetes.io/part-of: docker-image-builder
spec:
  selector:
    app.kubernetes.io/name: dib-control-plane
  ports:
    - name: http
      port: 3000
      targetPort: http
