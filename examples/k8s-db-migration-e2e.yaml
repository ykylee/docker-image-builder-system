apiVersion: apps/v1
kind: Deployment
metadata:
  name: dib-db-migration-e2e
  namespace: dib-hosted
  labels:
    app.kubernetes.io/name: dib-db-migration-e2e
    app.kubernetes.io/hosted-service: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dib-db-migration-e2e
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dib-db-migration-e2e
        app.kubernetes.io/hosted-service: "true"
    spec:
      initContainers:
        - name: service-database-migration
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1
              -c "create table if not exists migration_gate_probe (id integer primary key, marker text not null)"
              -c "insert into migration_gate_probe (id, marker) values (1, 'migration-ok') on conflict (id) do update set marker = excluded.marker"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dib-service-db-demo-5508efeb2968-db
                  key: DATABASE_URL
                  optional: false
      containers:
        - name: app
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - echo 'migration gate app ready'
              && sleep 3600
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dib-service-db-demo-5508efeb2968-db
                  key: DATABASE_URL
                  optional: false
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
