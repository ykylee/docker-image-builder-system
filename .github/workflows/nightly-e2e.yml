# =============================================================================
#  docker-image-builder-system — Nightly e2e + Visual QA
# =============================================================================
#  TASK-156: e2e 13종 + build-monitor 시각 QA 를 nightly / main push / 수동
#  트리거로 돌린다.
#
#  왜 필요한가 (v0.2.1 의 실증):
#    - 루트 Dockerfile 의 build-monitor 빌드가 깨진 채 v0.2.0 까지 잠복했다.
#      실이미지 e2e 를 한 번 돌리자 즉시 드러났다 (TASK-153).
#    - chunked 업로드로 올린 build 가 runner 에게 **영원히 claim 되지 않던**
#      제품 결함도 e2e 를 돌려서야 드러났다 (TASK-155). 그 e2e 는 `--build`
#      가 없어 오래된 이미지만 검증하고 있었다.
#    두 사례 모두 "단위 테스트·PR 가드가 green 이어도 프로덕션 경로는 별개"
#    라는 같은 결의 사각지대다. e2e 를 nightly 에 고정해 자동 검출한다.
#
#  기존 워크플로와의 역할 분담:
#    docker-build.yml   PR + main push — 정적 가드 + 이미지 build/smoke (빠름)
#    nightly-b-layer    nightly 03:00 UTC — 실브라우저 가드(대비/CSS 유출)
#    nightly-e2e (본)   nightly 04:00 UTC — e2e 13종 + 시각 QA + 통합 배포 e2e
#                      (Helm/hosted HTTP/ArgoCD, v0.9.0) + k8s-deploy-e2e
#                      (TASK-175 / v0.8.1)
#                      (느림, 도커 실사용)
#
#  visual 잡의 baseline 정책:
#    TASK-152 의 baseline PNG 는 binary 라 .gitignore 로 git 에서 제외돼
#    있고 외부 LFS 동기화 정책이 미결이다. 그래서 CI 는 **baseline 없이도
#    유효한 구조 검증**(라우트 셋 완전성 / 0 byte / dark≠light / modal≠base)
#    을 기본으로 돌리고, PNG 는 artifact 로 올려 사람이 볼 수 있게 한다.
#    LFS 정책이 정해지면 run-visual-check.sh --baseline 으로 픽셀 diff 를
#    켜면 된다.
# =============================================================================

name: nightly-e2e

on:
  schedule:
    # nightly-b-layer(03:00 UTC) 와 1시간 띄워 도커 자원 경합을 피한다.
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths:
      - 'apps/build-server/scripts/e2e-*.sh'
      - 'apps/runner/scripts/e2e-*.sh'
      - 'apps/build-server/src/**'
      - 'apps/runner/**'
      - 'apps/build-monitor/react/**'
      - 'apps/build-monitor/vite.config.ts'
      - 'apps/build-monitor/tests/visual/**'
      - 'packages/**'
      - 'scripts/run-e2e-suite.sh'
      - 'scripts/run-visual-check.sh'
      - 'compose.dev*.yaml'
      - 'Dockerfile'
      - 'apps/runner/Dockerfile'
      - '.github/workflows/nightly-e2e.yml'
      - 'apps/build-monitor/playwright.auth.config.ts'
      - 'apps/build-monitor/tests/e2e-auth/**'
  workflow_dispatch:
    inputs:
      group:
        description: "e2e 그룹"
        required: true
        type: choice
        default: "all"
        options: [all, local, compose, runner]
      run_visual:
        description: "시각 QA 도 실행"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.15.0"
  NODE_VERSION: "20"
  GO_VERSION: "1.22"

jobs:
  # ---------------------------------------------------------------------------
  # e2e 13종 — 호스트에서 docker compose 를 직접 구동하므로 guard container
  # 안이 아니라 러너 호스트에서 돈다.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e / ${{ inputs.group || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # local 그룹의 postgres 기반 e2e 용. compose 기반 e2e 는 자기 스택의
      # postgres 를 따로 띄우므로 이 service 와 무관하다.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build artifacts (e2e 전제)
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc -p packages/shared-contract/tsconfig.json
          ./node_modules/.bin/tsc -p packages/shared-config/tsconfig.json
          ./node_modules/.bin/tsc -p packages/db/tsconfig.json
          ./node_modules/.bin/tsc -p apps/build-server/tsconfig.json
          (cd apps/build-monitor && ./node_modules/.bin/vite build)
          (cd apps/runner && go build -o bin/runner-bin ./cmd/runner)

      - name: Run e2e suite
        env:
          # compose e2e 가 host docker socket 을 runner container 에 물린다.
          ADMIN_IDS: admin
          PGPORT: "5432"
          PG_SUPERUSER: postgres
          # GHA postgres service 가 host 5432 를 점유하므로 compose 의
          # postgres 는 다른 포트로 publish 한다 (TASK-154 의 override).
          DIBS_POSTGRES_HOST_PORT: "15432"
          E2E_LOG_DIR: ${{ github.workspace }}/.e2e-logs
          NO_COLOR: "1"
        run: bash scripts/run-e2e-suite.sh --group "${{ inputs.group || 'all' }}"

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: .e2e-logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Teardown leftovers
        if: always()
        run: |
          docker rm -f $(docker ps -aq --filter "name=dibs-") 2>/dev/null || true
          docker volume ls -q | grep -i dibs | xargs -r docker volume rm 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # 인증 계약 브라우저 e2e (TASK-184) — public submission과 authenticated
  # owner read/cross-tenant denial/logout을 실제 Vite proxy + Build Server
  # HTTP 경로에서 검증한다. IdP 대신 테스트 전용 signed fixture token을
  # 사용하며, 운영 issuer를 만들거나 secret을 외부에 노출하지 않는다.
  # ---------------------------------------------------------------------------
  auth-browser-e2e:
    name: auth browser e2e
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build auth E2E artifacts
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc -p packages/shared-contract/tsconfig.json
          ./node_modules/.bin/tsc -p packages/shared-config/tsconfig.json
          ./node_modules/.bin/tsc -p packages/db/tsconfig.json
          ./node_modules/.bin/tsc -p apps/build-server/tsconfig.json
          (cd apps/build-monitor && ./node_modules/.bin/vite build)

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Run auth browser contract
        env:
          NO_COLOR: "1"
        run: pnpm --filter @docker-image-builder-system/build-monitor test:e2e:auth

  # ---------------------------------------------------------------------------
  # 시각 QA — capture + 구조 검증. baseline 픽셀 diff 는 LFS 정책 확정 후.
  # ---------------------------------------------------------------------------
  visual:
    name: visual QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.run_visual != false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build build-server dist (visual wrapper 전제)
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc -p packages/shared-contract/tsconfig.json
          ./node_modules/.bin/tsc -p packages/shared-config/tsconfig.json
          ./node_modules/.bin/tsc -p packages/db/tsconfig.json
          ./node_modules/.bin/tsc -p apps/build-server/tsconfig.json

      - name: Install Chrome
        # capture.py 는 channel="chrome" 을 쓴다 (playwright 번들 chromium 은
        # 사내망에서 CDN ETIMEDOUT — TASK-132/133 에서 확립된 방식).
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install python playwright
        run: pip install --quiet playwright Pillow

      - name: Run visual check
        env:
          NO_COLOR: "1"
        run: bash scripts/run-visual-check.sh --out "${{ github.workspace }}/.visual/ci"

      - name: Upload visual PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ github.run_id }}
          path: .visual/ci/
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 통합 배포 e2e (v0.9.0) — 같은 job에서 Helm lifecycle, hosted HTTP
  # path/subdomain + management, ArgoCD Application sync/health/cleanup을
  # 순차 실행한다. 각 스크립트는 서로 다른 kind cluster를 사용한다.
  # kind 셋업이 무거워 schedule / 수동 dispatch 에서만 돈다 (매 push 제외).
  # ---------------------------------------------------------------------------
  deployment-e2e:
    name: deployment-e2e (helm+hosted+argocd)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kind + kubectl
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@v0.24.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sLo /tmp/kubectl "https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Install deps (tsx)
        run: pnpm install --frozen-lockfile

      - name: Run Helm e2e
        env:
          NO_COLOR: "1"
          DIB_HELM_E2E_CLUSTER: dib-helm-e2e
          DIB_HELM_E2E_NS: dib-helm-e2e
        run: bash apps/runner/scripts/e2e-helm-deploy.sh

      - name: Run hosted HTTP e2e
        env:
          NO_COLOR: "1"
        run: bash apps/runner/scripts/e2e-hosting.sh

      - name: Run ArgoCD e2e
        env:
          NO_COLOR: "1"
          DIB_ARGOCD_E2E_CLUSTER: dib-argocd-e2e
          DIB_ARGOCD_E2E_TARGET_NAMESPACE: dib-argocd-e2e
          DIB_ARGOCD_E2E_ARGO_NAMESPACE: argocd
        run: bash apps/runner/scripts/e2e-argocd-deploy.sh

      - name: Teardown kind leftovers
        if: always()
        run: |
          kind delete cluster --name dib-helm-e2e >/dev/null 2>&1 || true
          kind delete cluster --name dib-hosting-e2e >/dev/null 2>&1 || true
          kind delete cluster --name dib-argocd-e2e >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------------
  # k8s e2e (Phase 2 / TASK-165 — v0.8.1 nightly 편입) — busybox httpd 빌드
  # → kind load → kubectlDeployer 실배포(availableReplicas=1) + webhook 결과
  # 전달. kind 셋업이 무거워 schedule / 수동 dispatch 에서만 돈다 (매 push
  # 제외). hosting-e2e 와 cluster 가 분리(dib-e2e) 돼 동시 실행 안전.
  # ---------------------------------------------------------------------------
  k8s-deploy-e2e:
    name: k8s-deploy-e2e (kind+webhook)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install kind + kubectl
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@v0.24.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sLo /tmp/kubectl "https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Install deps (tsx)
        run: pnpm install --frozen-lockfile

      - name: Run k8s e2e
        env:
          NO_COLOR: "1"
          # e2e-k8s-deploy.sh 가 busybox httpd 를 docker build 한 뒤
          # kind 노드에 load + kubectlDeployer (Go test -tags k8se2e) +
          # webhook stub 으로 BuildStatusResponse 수신 검증까지 수행.
          # cluster 없으면 생성하고 종료 시 삭제(기존 클러스터 보존).
          DIB_K8S_E2E_CLUSTER: dib-e2e
          DIB_K8S_E2E_NS: dib-e2e
        run: bash apps/runner/scripts/e2e-k8s-deploy.sh

      - name: Teardown leftovers
        if: always()
        run: |
          docker rm -f $(docker ps -aq --filter "name=dibs-") 2>/dev/null || true
          docker volume ls -q | grep -i dibs | xargs -r docker volume rm 2>/dev/null || true
