# syntax=compose-spec/docker-compose:latest-spec
# =============================================================================
#  docker-image-builder-system — chunked multi-runner e2e override (postgres)
# =============================================================================
#  TASK-113: TASK-082 의 multi-runner 운영 검증의 postgres backend 에 chunked
#  source archive (TASK-106 의미 B + 의미 C 의미 A + 의미 C 의미 C strict)
#  를 도입한 cross-backend 회귀 가드. compose.dev.runner-multi-postgres.yaml
#  의 3 runner + postgres profile 위에 STRICT_CONTENT_RANGE env flag 까지
#  spread. 운영자가 운영 가이드의 chunked + chunked-strict rollout playbook 의
#  release staging 검증으로 사용.
#
#  사용:
#    export DOCKER_SOCKET_GID="$(getent group docker | cut -d: -f3)"
#    export ADMIN_IDS=admin
#    docker compose -f compose.dev.yaml -f compose.dev.runner-multi-postgres.yaml \
#      -f compose.dev.multi-runner-chunked-postgres.yaml \
#      --profile postgres \
#      --project-name dibs-mr-chunked-pg-$$ \
#      up -d
#    bash apps/build-server/scripts/e2e-multi-runner-chunked-postgres.sh
#    docker compose ... down -v
#
#  핵심 env override (TASK-082 의 multi-runner + postgres profile 위에):
#    - STRICT_CONTENT_RANGE=true : build-server 의 chunked upload 가
#      RFC 7233 §4.2 의 `*` total 을 거부하고 callers 가 numeric total
#      을 의무화하도록 함. 운영자가 deployment 시점에 정책 결정.
#    - build-server 쪽 STRICT_CONTENT_RANGE 가 active 일 때 모든 build 가
#      chunked 의미 C 의 strict 모드에서 claim → build → terminal 까지
#      운영 검증.
#  주의:
#    - chunked split 의 운영 semantics 는 TASK-106 + TASK-108 + TASK-109 +
#      TASK-110 봉인 그대로. 본 TASK 의 신규 변경 0 — 운영 가이드 추가 +
#      e2e 스크립트 신규만.
# =============================================================================

services:
  build-server:
    environment:
      STRICT_CONTENT_RANGE: "true"
