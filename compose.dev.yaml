# syntax=compose-spec/docker-compose:latest-spec
# =============================================================================
#  docker-image-builder-system — local self-dogfood compose
# =============================================================================
#  `docker compose -f compose.dev.yaml up --abort-on-container-exit` 으로
#  build-server + runner + (옵션) postgres 를 같은 network 안에서 띄운다.
#  기본 self-dogfood backend 는 Postgres로 사용해 컨테이너 재기동 후에도
#  build history가 보존되도록 한다. memory backend가 필요하면
#  `BUILD_REPOSITORY_BACKEND=memory`로 명시한다.
#
#  필수 환경 변수 (fallback 없이):
#    - DOCKER_SOCKET_GID: 호스트의 docker group gid. host 의
#      `/var/run/docker.sock` 권한 (root:docker 0660) 과 일치해야 runner 가
#      socket 에 R/W 가능. 조회: `getent group docker | cut -d: -f3`.
#      본인 환경에 맞춰 명시적으로 export. 예:
#        export DOCKER_SOCKET_GID=$(getent group docker | cut -d: -f3)
#        docker compose -f compose.dev.yaml up -d
#
#  기본 흐름:
#    - build-server: 포트 3000 노출. Build Monitor SPA dist 도 같은 포트에
#      정적 mount + SPA fallback. /docs Swagger UI 도 동일 포트.
#      HEALTHCHECK 가 /health 통과하면 runner 가 dependency 활성화.
#    - runner: build-server 의 /builds/claim 을 polling. host docker socket
#      을 공유 mount 해서 container 안에서 build/test/deploy 단계 실행.
#    - postgres: `--profile postgres` 시에만 활성. DATABASE_URL env 로
#      build-server 가 schema_migrations 까지 자동 bootstrap.
#
#  사용 예:
#    # postgres backend (default)
#    export DOCKER_SOCKET_GID=$(getent group docker | cut -d: -f3)
#    docker compose -f compose.dev.yaml up -d
#
#    # memory backend (명시적 fallback)
#    BUILD_REPOSITORY_BACKEND=memory docker compose -f compose.dev.yaml up -d
#
#    # log 추적
#    docker compose -f compose.dev.yaml logs -f build-server
#
#    # 종료 + cleanup
#    docker compose -f compose.dev.yaml down -v
#
#  주의 (host 의 docker socket 공유):
#    빌드된 container 가 host 데몬에서 spawn 됨. 동등 권한 → rootless
#    DinD 또는 별도 runner node 도입 검토는 후속 TASK. (`compose.dev.yaml`
#    의 의도 자체가 self-dogfood — 운영 가이드 아님).
# =============================================================================

services:
  build-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: dibs/build-server:dev
    container_name: dibs-build-server
    # dev/self-dogfood 용 — 실패 시 자동 재시작. 무한 restart 방지하려면
    # `on-failure: 5` 처럼 한계 명시 가능. 본 PR 은 default.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # 운영자가 명시적으로 주입해야 하는 env (Dockerfile 에는 default 없음).
    # - ADMIN_IDS / AUTH_HMAC_SECRET 은 secret 처럼 취급 (PROJECT_PROFILE §3).
    environment:
      BUILD_REPOSITORY_BACKEND: ${BUILD_REPOSITORY_BACKEND:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://dibs:dibs@postgres:5432/dibs}
      DB_AUTO_BOOTSTRAP: "true"
      ADMIN_IDS: ${ADMIN_IDS:?ADMIN_IDS must be set, e.g. "admin,yky.lee"}
      BUILD_MONITOR_DIST_PATH: /app/apps/build-monitor/dist
      BUILD_MONITOR_REACT_DIST_PATH: /app/apps/build-monitor/dist
      HOSTING_BASE_HOST: ${HOSTING_BASE_HOST:-100.119.181.116:18080}
      HOSTING_KUBE_CONTEXT: ${HOSTING_KUBE_CONTEXT:-kind-dib}
      HOSTING_KUBECTL_BIN: kubectl
      HOSTING_STATUS_SYNC_INTERVAL_MS: ${HOSTING_STATUS_SYNC_INTERVAL_MS:-10000}
      # Hosted service databases use the cluster-local gateway. The gateway
      # forwards to the host PostgreSQL; the host address is never injected
      # into hosted app containers.
      SERVICE_DB_GATEWAY_HOST: ${SERVICE_DB_GATEWAY_HOST:-dib-db-gateway.dib-hosted.svc.cluster.local:5432}
      SERVICE_DB_DATABASE_NAME: ${SERVICE_DB_DATABASE_NAME:-dibs}
      KUBECONFIG: /run/kube/config
      # Phase 1 (v0.10.0) Identity + 테넌트 권한 — HMAC cookie 인증 env.
      # - AUTH_HMAC_SECRET: secret 처럼 취급. 운영 baseline 필수. self-dogfood
      #   / staging 만 미설정 + AUTH_LEGACY_HEADERS=true 로 X-User-Id 호환.
      # - AUTH_TOKEN_TTL_SECONDS: default 28800 (8h). 운영자가 secret rotation
      #   주기에 맞춰 조정.
      # - AUTH_LEGACY_HEADERS: default false (운영). self-dogfood / staging 만
      #   true 로 legacy X-User-Id / X-Admin-Id 헤더 fallback 허용.
      # - BUILD_OWNER_POLICY_LEGACY_DEFAULT_SUBJECT: legacy ON 환경의 X-User-Id
      #   부재 시 default subject (default "<anonymous>"). self-dogfood 호환.
      AUTH_HMAC_SECRET: ${AUTH_HMAC_SECRET:-}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-28800}
      AUTH_LEGACY_HEADERS: ${AUTH_LEGACY_HEADERS:-false}
      BUILD_OWNER_POLICY_LEGACY_DEFAULT_SUBJECT: ${BUILD_OWNER_POLICY_LEGACY_DEFAULT_SUBJECT:-<anonymous>}
      NODE_ENV: production
    ports:
      # Override for isolated e2e runs; default remains the local dev port.
      - "${BUILD_SERVER_HOST_PORT:-3000}:3000"
    healthcheck:
      # 15초 start_period — postgres backend 의 cold start (applyMigrations)
      # 가 5초보다 길 수 있어 여유. memory backend 에서는 1~2초 안에 health.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    # build-server 메모리 한계 — postgres backend 의 applyMigrations / 일반
    # REST traffic 의 여유. 운영 시에는 pod level 에서 별도 설정.
    mem_limit: 512m
    volumes:
      - dibs-kubeconfig:/run/kube:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    image: dibs/runner:dev
    container_name: dibs-runner
    # on-failure: 실패 시에만 재시작. backoff 정책은 runner binary 내부에서
    # 처리 (후속 TASK). docker-level restart 는 socket 권한 미스매치 등
    # 설정 오류로 인한 무한 restart 방지.
    restart: on-failure
    depends_on:
      build-server:
        condition: service_healthy
    environment:
      HOST_SERVER_BASE_URL: ${HOST_SERVER_BASE_URL:-http://build-server:3000}
      RUNNER_ID: runner-compose-1
      RUNNER_POLL_INTERVAL: 5s
      # self-dogfood must exercise the real Docker daemon through the mounted
      # socket. Skeleton mode remains available only for isolated contract
      # tests, never for the long-running dev service.
      RUNNER_DOCKER_BUILD_MODE: ${RUNNER_DOCKER_BUILD_MODE:-cli}
      RUNNER_DOCKER_RUN_MODE: ${RUNNER_DOCKER_RUN_MODE:-cli}
      RUNNER_STOP_CONTAINER_ON_DONE: ${RUNNER_STOP_CONTAINER_ON_DONE:-true}
      # Apps such as Build Server expose readiness at /health rather than /.
      # Keep / as the generic default; self-hosting this project uses
      # RUNNER_HEALTHCHECK_PATH=/health for the build/run cycle.
      RUNNER_HEALTHCHECK_PATH: ${RUNNER_HEALTHCHECK_PATH:-/}
      # The runner is itself a container, while test containers publish their
      # ports through the Docker host. Probe through the host gateway instead
      # of the runner container's own loopback.
      RUNNER_DOCKER_HOST: ${RUNNER_DOCKER_HOST:-host.docker.internal}
      RUNNER_K8S_MODE: ${RUNNER_K8S_MODE:-k8s}
      RUNNER_K8S_CLUSTER: ${RUNNER_K8S_CLUSTER:-kind-dib}
      RUNNER_K8S_NAMESPACE: ${RUNNER_K8S_NAMESPACE:-dib-hosted}
      RUNNER_K8S_KIND_NODE: ${RUNNER_K8S_KIND_NODE:-dib-control-plane}
      # Cluster-local control-plane Service. Hosted bundles use <context>/api
      # and Ingress forwards it here; no host IP is embedded in the bundle.
      RUNNER_K8S_API_SERVICE: ${RUNNER_K8S_API_SERVICE:-dib-control-plane}
      RUNNER_K8S_API_PORT: ${RUNNER_K8S_API_PORT:-3000}
      # Optional per-image migration gate. The command runs in an init
      # container with the service-local DATABASE_URL Secret.
      RUNNER_HOSTING_BASE_HOST: ${RUNNER_HOSTING_BASE_HOST:-100.119.181.116:18080}
      RUNNER_KUBECTL_BIN: kubectl
      KUBECONFIG: /run/kube/config
    # host docker socket 을 공유 mount → container 가 host 데몬을 통해
    # build/test/deploy 단계 실행. self-dogfood 용 단순화 (DinD 미사용).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dibs-kubeconfig:/run/kube:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # host 의 docker group gid 를 supplementary group 으로 추가. socket R/W
    # 권한 (root:docker 0660) 에 필요한 gid. silent fallback 없이 명시 강제.
    # 자기 환경에 맞춰 export 후 사용:
    #   export DOCKER_SOCKET_GID=$(getent group docker | cut -d: -f3)
    #   docker compose -f compose.dev.yaml up -d
    group_add:
      - "${DOCKER_SOCKET_GID:?DOCKER_SOCKET_GID must be set; run 'getent group docker | cut -d: -f3' on the host}"
    # build/test/deploy 단계의 docker spawn + log stream 으로 메모리 footprint
    # 가 변동. 256 MB 는 단일 build 한계 가정.
    mem_limit: 512m

  # 기본 persistence backend. memory backend를 명시한 경우에도 컨테이너는
  # 기동하지만 Build Server가 연결하지 않아 local override가 단순하다.
  postgres:
    image: postgres:16-alpine
    container_name: dibs-postgres
    environment:
      POSTGRES_USER: dibs
      POSTGRES_PASSWORD: dibs
      POSTGRES_DB: dibs
    ports:
      # TASK-154: 호스트 포트를 설정 가능하게. e2e 스크립트는 전부
      # `docker compose exec postgres psql` (컨테이너 내부) 로 접속하므로
      # 이 publish 는 개발 편의용이다. 로컬에 native PostgreSQL 이 5432 를
      # 점유한 환경에서는 bind 실패로 postgres 계열 e2e 가 전부 죽으므로
      # override 할 수 있어야 한다:
      #   DIBS_POSTGRES_HOST_PORT=15432 bash apps/build-server/scripts/e2e-...-postgres.sh
      - "${DIBS_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dibs -d dibs"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    # postgres 메모리 한계 — 운영에서는 별도 설정.
    mem_limit: 512m

volumes:
  postgres-data:
  dibs-kubeconfig:
    external: true
